<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS Khankot — SMS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14264B">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#14264B; --deep:#0B1733; --royal:#315CE8; --electric:#4F7CFF; --teal:#0F9F95; --emerald:#15966A; --amber:#F2B544; --violet:#7957D5; --coral:#E76868;
  --bg:#F4F7FC; --card:#FFFFFF; --line:#E2E8F0; --text:#17243D; --sub:#64748B; --field:#CBD5E1; --thead:#EEF3FB;
  --gold:#F2B544; --gold-2:#D99A22; --gold-soft:#FBE3A8; --navy-2:#315CE8; --crest:#14264B; --masthead-tag:#FBE3A8;
  --emerald-ink:#0E7050; --brick:#C23B3B; --radius:14px; --shadow:0 1px 2px rgba(20,38,75,.06),0 4px 14px rgba(20,38,75,.05);
  --sans:"Inter","Noto Naskh Arabic",-apple-system,"Segoe UI",Roboto,sans-serif; --serif:var(--sans);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0B1220; --card:#121B2E; --line:#25324B; --text:#EAF0FA; --sub:#9AA8C2; --field:#3A4A68; --thead:#18233A; --crest:#A9C0FF; --emerald-ink:#4FD1A5; --brick:#FF8F8F; }
}
*{box-sizing:border-box;}
html,body{min-height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
html[lang="ur"] body{font-family:"Noto Naskh Arabic","Inter",sans-serif;line-height:1.85;}
:focus-visible{outline:3px solid var(--electric);outline-offset:2px;}
.wrap{max-width:none;margin:0;padding:0 0 40px;}

.masthead{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;color:#fff;overflow:hidden;background:linear-gradient(120deg,var(--deep) 0%,var(--navy) 55%,#24408F 100%);border-bottom:3px solid var(--amber);}
.masthead::before{content:"";position:absolute;top:-80%;inset-inline-end:-6%;width:340px;height:260%;background:radial-gradient(circle,rgba(242,181,68,.22),transparent 65%);pointer-events:none;}
.crestrow{display:flex;align-items:center;gap:12px;position:relative;}
.crest svg{display:block;}
.school-name{font-weight:700;font-size:19px;letter-spacing:.2px;line-height:1.15;}
.school-tag{color:var(--masthead-tag);font-size:12px;margin-top:2px;}
.namebar{position:relative;margin-inline-start:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:rgba(255,255,255,.82);}
.namebar b{color:#fff;}
.role-badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--amber);color:#2E2100;margin-inline-start:6px;text-transform:capitalize;}
.actions{display:flex;gap:8px;}
.signout{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:7px 14px;font-size:12.5px;min-height:36px;}
.signout:hover{background:rgba(255,255,255,.22);}
.menubtn{display:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;width:40px;height:40px;padding:0;align-items:center;justify-content:center;position:relative;}
.menubtn svg,.tab svg,.kpi .ico svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.menubtn svg{width:22px;height:22px;}
.scrim{display:none;}
.offline-banner{background:var(--gold-soft);color:#54430e;font-size:12.5px;text-align:center;padding:8px;display:none;}
.offline-banner.show{display:block;}

.content{max-width:1320px;margin:0 auto;padding:20px;}
#root.authed{display:grid;grid-template-columns:248px minmax(0,1fr);gap:24px;align-items:start;}
.tabs{position:sticky;top:88px;display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);max-height:calc(100vh - 108px);overflow-y:auto;}
.navgroup{font-size:11.5px;font-weight:600;color:var(--sub);padding:12px 10px 4px;}
.tab{display:flex;align-items:center;gap:11px;width:100%;text-align:start;padding:9px 11px;min-height:40px;background:transparent;color:var(--text);border-radius:10px;font-size:13.5px;font-weight:500;}
.tab svg{width:18px;height:18px;flex:none;color:var(--sub);}
.tab:hover{background:rgba(49,92,232,.08);}
.tab.active{background:linear-gradient(135deg,var(--royal),var(--violet));color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(49,92,232,.28);}
.tab.active svg{color:#fff;}
.main{min-width:0;}
.pagehead{margin-bottom:16px;}
.pagehead h1,.welcome h1{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:0;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
h2{font-size:17px;font-weight:700;margin:0 0 12px;}
h3{font-size:15px;font-weight:600;}
.sub{color:var(--sub);font-size:12.5px;margin:2px 0 12px;}
label{display:block;font-size:13px;font-weight:500;margin:10px 0 5px;}
input,select,textarea{width:100%;padding:9px 11px;min-height:40px;border-radius:10px;border:1px solid var(--field);background:var(--card);color:var(--text);font:inherit;font-size:14px;}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(79,124,255,.45);outline-offset:0;border-color:var(--royal);}
textarea{resize:vertical;min-height:56px;}
fieldset{border:0;margin:0;padding:0;min-width:0;}
legend{font-size:14px;font-weight:600;padding:0;margin:14px 0 2px;color:var(--crest);}
.req{color:var(--brick);}
.field-err{color:var(--brick);font-size:12.5px;margin-top:8px;min-height:1px;}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:2px 14px;}

button{cursor:pointer;border:0;border-radius:10px;font:600 13.5px var(--sans);padding:10px 16px;min-height:40px;transition:transform .15s,box-shadow .15s,background .15s;}
button:active{transform:scale(.98);}
button:disabled{opacity:.6;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--royal),#2447C4);color:#fff;margin-top:12px;}
.btn-primary:hover{box-shadow:0 6px 16px rgba(49,92,232,.3);}
.btn-accent2{background:linear-gradient(135deg,var(--amber),#E5A02B);color:#2E2100;margin-top:12px;}
.btn-whatsapp{background:#128C4A;color:#fff;margin-top:8px;}
.chip-white,.chip-green,.chip-red,.chip-blue,.chip-gold,.chip-yellow,.chip-boy,.chip-girl{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;}
.chip-white{background:linear-gradient(135deg,var(--navy),#24408F);}
.chip-green{background:linear-gradient(135deg,#0E7A57,#15966A);}
.chip-red{background:#C23B3B;}
.chip-blue,.chip-boy{background:#2748C9;}
.chip-girl{background:#C2397F;}
.chip-gold,.chip-yellow{background:var(--amber);color:#2E2100;}
.btn-sm{background:var(--card);border:1px solid var(--field);color:var(--text);padding:6px 12px;font-size:12.5px;min-height:36px;}
.btn-sm:hover{border-color:var(--royal);color:var(--royal);}
.btn-sm.chip-green{background:#0E7A57;color:#fff;border-color:transparent;}
.btn-sm.chip-red{background:#C23B3B;color:#fff;border-color:transparent;}
.btn-sm.chip-blue{background:#2748C9;color:#fff;border-color:transparent;}
.btn-sm.chip-yellow{background:var(--amber);color:#2E2100;border-color:transparent;}
.btn-danger{background:transparent;border:1px solid var(--brick);color:var(--brick);padding:6px 12px;font-size:12.5px;min-height:36px;}
.btn-danger:hover{background:rgba(194,59,59,.09);}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;margin-top:6px;}
.table-wrap table{min-width:480px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);}
th{background:var(--thead);font-size:12px;font-weight:600;white-space:nowrap;}
tr:last-child td{border-bottom:0;}
tr:hover td{background:rgba(49,92,232,.04);}
td input,td select{min-height:34px;padding:5px 8px;}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
.pill-ok{background:rgba(21,150,106,.14);color:var(--emerald-ink);}
.pill-bad{background:rgba(231,104,104,.16);color:var(--brick);}
.pill-warn{background:rgba(242,181,68,.26);color:#7A4F00;}
.studlink{color:var(--royal);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px;}
.msg,.notice,.hwcard{border:1px solid var(--line);border-inline-start:4px solid var(--royal);padding:12px 14px;margin-bottom:10px;background:var(--card);border-radius:12px;}
.notice{border-inline-start-color:var(--amber);background:linear-gradient(90deg,rgba(242,181,68,.12),transparent 45%);}
.hwcard{border-inline-start-color:var(--teal);}
.meta{color:var(--sub);font-size:12px;margin-top:6px;}
.empty{color:var(--sub);font-size:13.5px;text-align:center;padding:22px 12px;}
div.empty{border:1px dashed var(--line);border-radius:12px;}
.error{color:var(--brick);font-size:13px;}

.welcome{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;padding:20px 22px;margin-bottom:14px;border-radius:var(--radius);color:#fff;background:linear-gradient(120deg,var(--deep),var(--navy) 50%,var(--royal));box-shadow:var(--shadow);}
.welcome h1{font-size:22px;}
.welcome p{margin:4px 0 0;color:#D5DEF5;font-size:13.5px;}
.quick{display:flex;gap:8px;flex-wrap:wrap;}
.quick button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.32);}
.quick button:hover{background:rgba(255,255,255,.26);}
.dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px;}
.dashgrid.sm{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
.kpi{display:flex;align-items:center;gap:14px;min-height:96px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;}
.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,38,75,.1);}
.kpi .ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--ink);}
.kpi .ico svg{width:22px;height:22px;}
.kpi .big{font-size:26px;font-weight:700;line-height:1.1;}
.kpi .lbl{font-size:12.5px;color:var(--sub);margin-top:3px;}
.sm .kpi{min-height:0;padding:12px 14px;}
.sm .big{font-size:22px;color:var(--ink);}
.k-blue{--tint:rgba(49,92,232,.12);--ink:#2748C9;} .k-teal{--tint:rgba(15,159,149,.14);--ink:#0B766F;} .k-amber{--tint:rgba(242,181,68,.24);--ink:#8A5A00;} .k-violet{--tint:rgba(121,87,213,.14);--ink:#5B3FB5;} .k-coral{--tint:rgba(231,104,104,.15);--ink:#B42E2E;}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px;}
.cols .card{margin:0;}
.bar{display:flex;height:9px;border-radius:99px;background:rgba(100,116,139,.18);overflow:hidden;margin:8px 0;}
.bar i{display:block;height:100%;}
.b-p{background:linear-gradient(90deg,var(--teal),var(--emerald));} .b-a{background:var(--coral);} .b-l{background:var(--electric);} .b-c{background:var(--ac,var(--royal));}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);}
.legend b{color:var(--text);}
.dist{display:grid;grid-template-columns:70px 1fr 30px;align-items:center;gap:10px;font-size:13px;margin:6px 0;}
.dist .bar{margin:0;}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.li:last-child{border-bottom:0;}

.classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.stamp{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px 16px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;}
.stamp:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,38,75,.1);}
.stamp::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:var(--ac,var(--royal));}
.ring{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--ac,var(--royal));background:color-mix(in srgb,var(--ac,var(--royal)) 14%,transparent);margin-bottom:10px;}
.stamp h2{margin-bottom:8px;}
.stat{display:flex;justify-content:space-between;font-size:13px;margin:4px 0;color:var(--sub);}
.stat b{color:var(--text);}
.stamp button{margin-top:10px;width:100%;}
.warnpanel{border-inline-start:5px solid var(--amber);background:linear-gradient(90deg,rgba(242,181,68,.14),var(--card) 50%);}
.profile{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
.profile>div:first-child{flex:0 0 110px;text-align:center;}
.profile>div:last-child{flex:1;min-width:240px;}
.subtabs,.classbtns{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.subtab,.classbtn{flex:none;padding:7px 14px;min-height:36px;border-radius:999px;background:var(--card);border:1px solid var(--field);color:var(--text);font-size:12.5px;font-weight:600;white-space:nowrap;}
.subtab.active,.classbtn.active{background:linear-gradient(135deg,var(--royal),var(--violet));color:#fff;border-color:transparent;}
.timetable{font-size:12px;}
.timetable th,.timetable td{border:1px solid var(--line);padding:4px;text-align:center;}
.timetable input{font-size:12px;padding:4px;text-align:center;min-height:32px;}
.loginwrap{max-width:400px;margin:48px auto 0;padding:0 4px;}
.toast{position:fixed;inset-inline-end:16px;bottom:16px;max-width:min(92vw,360px);background:var(--deep);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:100;font-size:13.5px;display:none;}


.dlg{border:0;border-radius:16px;padding:22px;max-width:min(92vw,440px);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);background:var(--card);color:var(--text);}
.dlg::backdrop{background:rgba(11,23,51,.55);}
.dlg p{margin:0 0 6px;color:var(--sub);}
.dlgbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.dlgbtns button{margin:0;}
.skel{height:92px;border-radius:14px;margin-bottom:14px;background:linear-gradient(90deg,var(--line),var(--thead),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;}
@keyframes sh{to{background-position:-200% 0;}}
.navbrand{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-weight:700;color:var(--crest);line-height:1.2;}
.navbrand small{display:block;font-weight:500;color:var(--sub);font-size:11px;}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 10px;font-size:13px;color:var(--sub);}
@media (max-width:899px){
  .menubtn,body.authed .menubtn{display:none;}
  body.authed .menubtn{display:inline-flex;}
  #root.authed{display:block;}
  .tabs{position:fixed;top:0;bottom:0;inset-inline-start:0;width:280px;max-width:86vw;max-height:none;z-index:50;border-radius:0;padding-top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .2s;}
  html[dir="rtl"] .tabs{transform:translateX(105%);}
  body.navopen .tabs{transform:none;}
  body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(11,23,51,.55);z-index:40;}
  .content{padding:14px;}
  .pagehead h1{font-size:24px;}
}
@media (max-width:600px){ .namebar{width:100%;justify-content:space-between;} .school-name{font-size:17px;} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important;} }
</style>
</head>

<div class="wrap">
  <div class="masthead">
    <button class="menubtn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD3kc5RKyQMVtyS9yDWAJvdRxt3fO9wxDo",
  authDomain: "gps-khankot-lms.firebaseapp.com",
  projectId: "gps-khankot-lms",
  storageBucket: "gps-khankot-lms.firebasestorage.app",
  messagingSenderId: "762201981873",
  appId: "1:762201981873:web:9e2d3733fcbdf96bebf390"
};
firebase.initializeApp(firebaseConfig);
const firestore = firebase.firestore();
const storage = firebase.storage();
const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary");
const secondaryAuth = secondaryApp.auth();
firestore.enablePersistence({ synchronizeTabs: true }).catch(()=>{});

async function uploadStudentPhoto(studentId, file){
  const ext = (file.name.split(".").pop()||"jpg").toLowerCase();
  const ref = storage.ref(`student-photos/${studentId}_${Date.now()}.${ext}`);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await firestore.collection("students").doc(studentId).update({photoUrl: url});
  logActivity("update", "students/"+studentId, "photo uploaded");
  return url;
}

const db = {
  collection(name){
    return {
      onSnapshot(cb){
        return firestore.collection(name).onSnapshot(snap=>{
          cb({ docs: snap.docs.map(d=>({ id:d.id, data:d.data() })) });
        });
      },
      async add(obj){
        const ref = await firestore.collection(name).add(obj);
        logActivity("add", name, obj && (obj.name||obj.title||obj.subject||""));
        return ref;
      }
    };
  },
  doc(path){
    const ref = firestore.doc(path);
    return {
      onSnapshot(cb){
        return ref.onSnapshot(snap=>{
          cb({ exists: snap.exists, data: snap.exists ? snap.data() : undefined, id: snap.id });
        });
      },
      async get(){ const s = await ref.get(); return { exists: s.exists, data: s.exists ? s.data() : undefined, id: s.id }; },
      async set(obj){ await ref.set(obj, {merge:false}); logActivity("set", path, ""); },
      async update(obj){ await ref.update(obj); logActivity("update", path, Object.keys(obj).join(",")); },
      async delete(){ await ref.delete(); logActivity("delete", path, ""); }
    };
  }
};

async function promoteAllStudents(){
  if(!await askConfirm("This moves EVERY active student up one class and graduates (archives) Class 5 students. It affects the whole school and cannot be easily undone.","PROMOTE")) return;
  const active = students.filter(s=>!s.archived);
  for(const s of active){
    const idx = CLASS_LIST.indexOf(s.className);
    if(idx<0) continue;
    if(idx === CLASS_LIST.length-1){
      await firestore.collection("students").doc(s.id).update({archived:true, archivedAt:Date.now(), graduated:true});
    } else {
      await firestore.collection("students").doc(s.id).update({className: CLASS_LIST[idx+1]});
    }
  }
  logActivity("promote", "students", `Promoted ${active.length} students`);
  toast("Promotion complete.");
}

function monthlyAttendanceTable(list, monthKey){
  if(!list.length) return `<div class="empty">No students to summarize.</div>`;
  const rows = list.map(s=>{
    const att = s.attendance||{};
    let present=0, absent=0, leave=0, marked=0;
    Object.keys(att).forEach(d=>{
      if(!d.startsWith(monthKey)) return;
      marked++;
      if(att[d]==="present") present++;
      else if(att[d]==="absent") absent++;
      else if(att[d]==="leave") leave++;
    });
    const pct = marked ? Math.round((present/marked)*100) : 0;
    const flag = marked && pct<75 ? `<span class="chip-red">${pct}%</span>` : `<span class="chip-green">${pct}%</span>`;
    return `<tr><td>${esc(s.name)}</td><td>${esc(s.className||"-")}</td><td>${present}</td><td>${absent}</td><td>${leave}</td><td>${flag}</td></tr>`;
  }).join("");
  return `<div class="table-wrap"><table><tr><th>Name</th><th>Class</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance %</th></tr>${rows}</table></div><p class="sub">Below 75% is flagged red — days with no mark aren't counted.</p>`;
}

function shareParentSummaryWhatsApp(stu){
  const today = todayStr();
  const monthKey = today.slice(0,7);
  const att = stu.attendance||{};
  let present=0, marked=0;
  Object.keys(att).forEach(d=>{ if(d.startsWith(monthKey)){ marked++; if(att[d]==="present") present++; } });
  const attPct = marked ? Math.round((present/marked)*100) : 0;
  const fineT = fineTotals(stu);
  const text = `GPS Khankot - Summary for ${stu.name} (${stu.className})\nAttendance this month: ${present}/${marked} (${attPct}%)\nFine: ${fineT.count ? "Total Rs."+fineT.total+", outstanding Rs."+fineT.outstanding : "None"}`;
  const digits = phoneDigits(stu.guardianContact);
  window.open(digits ? `https://wa.me/${digits}?text=${encodeURIComponent(text)}` : `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, "_blank");
}

// ---------------- FINE (government institution: full fine history per student) ----------------
function fineEntries(s){
  if(Array.isArray(s.fines)) return s.fines;
  const f = s.fine;
  if(f && Number(f.amount)>0) return [{id:"legacy", amount:Number(f.amount)||0, reason:f.reason||"", date:"", paid:!!f.paid}];
  return [];
}
function fineTotals(s){
  const e = fineEntries(s);
  const total = e.reduce((a,x)=>a+(Number(x.amount)||0),0);
  const outstanding = e.filter(x=>!x.paid).reduce((a,x)=>a+(Number(x.amount)||0),0);
  return {total, outstanding, paid: total-outstanding, count: e.length};
}
async function saveFineEntries(studentId, entries){
  const outstanding = entries.filter(x=>!x.paid).reduce((a,x)=>a+(Number(x.amount)||0),0);
  const last = entries[entries.length-1];
  await db.doc("students/"+studentId).update({fines: entries, fine:{amount: outstanding, reason: last?(last.reason||""):"", paid: outstanding===0}});
}
function money(n){ return "Rs. "+Number(n||0).toLocaleString(); }
function monthLabel(m){
  const d = new Date((m||"")+"-01");
  return isNaN(d) ? (m||"") : d.toLocaleString("en",{month:"long",year:"numeric"});
}

function viewFineMonthly(){

  const rows = list.map(s=>{

function viewFineYearly(){
  const list = fineStudentList();
  const y = String(fineYear);
  const mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const colTotals = Array(12).fill(0);
  let sumY=0,sumAll=0;
  const rows = list.map(s=>{
    const per = Array(12).fill(0);
    fineEntries(s).forEach(x=>{
      const d = x.date||"";
      if(d.slice(0,4)===y){ const mi = parseInt(d.slice(5,7),10)-1; if(mi>=0 && mi<12) per[mi]+=Number(x.amount)||0; }
    });
    const yt = per.reduce((a,b)=>a+b,0);
    const t = fineTotals(s);
    per.forEach((v,i)=>colTotals[i]+=v); sumY+=yt; sumAll+=t.total;
    return `<tr><td>${esc(s.rollNo||"-")}</td><td><span class="studlink" tabindex="0" role="button" data-finestu="${s.id}">${esc(s.name)}</span></td>${per.map(v=>`<td>${v||"-"}</td>`).join("")}<td><b>${yt?money(yt):"-"}</b></td><td><b>${t.total?money(t.total):"-"}</b></td></tr>`;
  }).join("");
  return `
    <div class="card"><label>Year</label><input type="number" id="fineYearPick" value="${esc(y)}" min="2000" max="2100" style="max-width:140px;"></div>
    <div class="card">
      <h2>Fines in ${esc(y)} ${classFilter?`(${esc(classFilter)})`:""}</h2>
      ${list.length ? `<div class="table-wrap"><table><tr><th>Roll</th><th>Name</th>${mons.map(m=>`<th>${m}</th>`).join("")}<th>Year total</th><th>All-time total</th></tr>${rows}<tr><td></td><td><b>Total</b></td>${colTotals.map(v=>`<td><b>${v||"-"}</b></td>`).join("")}<td><b>${money(sumY)}</b></td><td><b>${money(sumAll)}</b></td></tr></table></div>` : `<div class="empty">No students in this view yet.</div>`}
      <p class="sub">Monthly amounts are in Rs. Year total covers ${esc(y)} only; all-time total is the student's complete fine record, including undated fines.</p>
    </div>
  `;
}

function downloadFinesCsv(){

const FUNDS=[
  {k:"consumables", name:"Classroom consumables grant", unit:"classroom", rate:13000},
  {k:"repair", name:"Repair grant", unit:"classroom", rate:16000},
  {k:"capitation", name:"Student capitation grant", unit:"student", rate:300}
];
let finances=[], finSettings={classrooms:0, rates:{}}, finFilter="";
function finRate(f){ const r=Number((finSettings.rates||{})[f.k]); return r>0 ? r : f.rate; }
function finStats(){
  const live=finances.filter(x=>!x.archived), activeN=students.filter(s=>!s.archived).length, cr=Number(finSettings.classrooms)||0;
  return FUNDS.map(f=>{
    const sum=kind=>live.filter(x=>x.fund===f.k && x.kind===kind).reduce((a,x)=>a+(Number(x.amount)||0),0);
    const units=f.unit==="classroom" ? cr : activeN, rate=finRate(f), rec=sum("receipt"), sp=sum("expense");
    return {f, units, rate, ent:units*rate, rec, sp, bal:rec-sp};
  });
}

function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lines.map(l=>l.split(",").map(c=>c.trim().replace(/^"|"$/g,"")));
}

async function readRowsFromFile(file){
  const ext = file.name.split(".").pop().toLowerCase();
  if(ext==="csv"){
    const text = await file.text();
    return parseCsv(text);
  }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
  return rows.filter(r=>r.length && r.some(c=>String(c).trim()!=="")).map(r=>r.map(c=>String(c).trim()));
}

async function importStudentsCsv(){
  const fileInput = document.getElementById("importFile");
  const status = document.getElementById("importStatus");
  const file = fileInput.files[0];
  if(!file){ setMsg("importStatus", "Choose a CSV or Excel file first."); return; }
  const rows = await readRowsFromFile(file);
  const header = rows[0].map(h=>h.toLowerCase());
  const idx = (name)=>header.indexOf(name.toLowerCase());
  const iName=idx("name"), iClass=idx("class"), iGuardian=idx("guardiancontact"), iRoll=idx("rollno"), iAdm=idx("admissionno"), iDob=idx("dob"), iBlood=idx("bloodgroup"), iEmerg=idx("emergencycontact"), iGender=idx("gender"), iFather=Math.max(idx("fathername"), idx("father name"), idx("father"));
  if(iName<0 || iClass<0){ setMsg("importStatus", "CSV must have at least Name and Class columns."); return; }
  const existingByKey = new Map(students.filter(s=>!s.archived).map(s=>[dupeKey(s), s]));
  const normGender = (v)=>{ const t=(v||"").toString().trim().toLowerCase(); return t.startsWith("m")?"Male":t.startsWith("f")?"Female":""; };
  let count=0, skipped=0, duplicates=0, updated=0;
  setMsg("importStatus", "Importing…");
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    const name = r[iName]; const className = r[iClass];
    if(!name || !CLASS_LIST.includes(className)){ skipped++; continue; }
    const rollNo = iRoll>=0 ? (r[iRoll]||"") : "";
    const key = name.trim().toLowerCase()+"|"+className+"|"+rollNo.trim();
    const gender = iGender>=0 ? normGender(r[iGender]) : "";
    const fatherName = iFather>=0 ? (r[iFather]||"").trim() : "";
    if(existingByKey.has(key)){
      const ex = existingByKey.get(key);
      const patch = {};
      if(gender && ex.gender!==gender) patch.gender = gender;
      if(fatherName && ex.fatherName!==fatherName) patch.fatherName = fatherName;
      if(ex.id && Object.keys(patch).length){ await db.doc("students/"+ex.id).update(patch); Object.assign(ex, patch); updated++; }
      else { duplicates++; }
      continue;
    }
    existingByKey.set(key, {id:null, gender, fatherName});
    await db.collection("students").add({
      name, className,
      guardianContact: iGuardian>=0 ? (r[iGuardian]||"") : "",
      rollNo: iRoll>=0 ? (r[iRoll]||"") : "",
      admissionNo: iAdm>=0 ? (r[iAdm]||"") : "",
      dob: iDob>=0 ? (r[iDob]||"") : "",
      bloodGroup: iBlood>=0 ? (r[iBlood]||"") : "",
      emergencyContact: iEmerg>=0 ? (r[iEmerg]||"") : "",
      gender,
      fatherName,
      fine:{amount:0,reason:"",paid:true}, grades:{}, attendance:{}, messages:[]
    });
    count++;
  }
  let msg = `Imported ${count} student(s)`;
  if(updated) msg += `, updated gender / father name for ${updated} existing student(s)`;
  if(duplicates) msg += `, skipped ${duplicates} already-existing duplicate(s)`;
  if(skipped) msg += `, skipped ${skipped} row(s) with missing name or an unrecognized class name`;
  setMsg("importStatus", msg + ".");
}

function dupeKey(s){
  return (s.name||"").trim().toLowerCase()+"|"+(s.className||"")+"|"+(s.rollNo||"").trim();
}

async function findAndRemoveDuplicates(){
  const status = document.getElementById("dedupeStatus");
  const groups = {};
  students.filter(s=>!s.archived).forEach(s=>{
    const k = dupeKey(s);
    (groups[k] = groups[k]||[]).push(s);
  });
  const dupeGroups = Object.values(groups).filter(g=>g.length>1);
  const toRemove = dupeGroups.flatMap(g=>g.slice(1));
  if(!toRemove.length){ setMsg("dedupeStatus", "No duplicates found."); return; }
  if(!await askConfirm(`Found ${toRemove.length} duplicate record(s) across ${dupeGroups.length} student(s). Remove the extra copies? This keeps one copy of each and permanently deletes the rest.`)) return;
  setMsg("dedupeStatus", "Removing…");
  for(const s of toRemove){ await firestore.collection("students").doc(s.id).delete(); }
  logActivity("delete", "duplicates", `Removed ${toRemove.length} duplicate students`);
  setMsg("dedupeStatus", `Removed ${toRemove.length} duplicate record(s).`);
}

function downloadRosterCsv(){
  const today = todayStr();
  const header = "Roll No,Name,Father Name,Class,Gender,Guardian Contact,Total Fined,Fine Outstanding,Today Attendance\n";
  const rows = sortByRoll(students.filter(s=>!s.archived)).map(s=>{
    const t = fineTotals(s);
    const att = (s.attendance||{})[today] || "unmarked";
    return [s.rollNo||"", s.name, s.fatherName||"", s.className||"", s.gender||"", s.guardianContact||"", t.total, t.outstanding, att].map(v=>`"${(v+"").replace(/"/g,'""')}"`).join(",");
  }).join("\n");
  downloadBlob(header+rows, "text/csv", "gps-khankot-roster-" + today + ".csv");
}

function downloadBlob(content, type, filename){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function restoreFromBackup(){
  const fileInput = document.getElementById("restoreFile");
  const file = fileInput.files[0];
  if(!file) return alert("Choose a backup .json file first.");
  const btn = document.getElementById("restoreBtn");
  setMsg("restoreBtn", "Restoring…");
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(data.students){
      for(const s of data.students){
        const {id, ...rest} = s;
        await firestore.collection("students").doc(id).set(rest);
      }
    }
    if(data.homework) for(const h of data.homework){ const {id, ...rest} = h; await firestore.collection("homework").add(rest); }
    if(data.notices) for(const n of data.notices){ const {id, ...rest} = n; await firestore.collection("notices").add(rest); }
    if(data.timetable) await firestore.doc("timetable/main").set(data.timetable);
    logActivity("restore", "backup", file.name);
    setMsg("restoreBtn", "Restore complete!");
  }catch(e){
    alert("Restore failed: " + e.message);
    setMsg("restoreBtn", "Restore from file");
  }
}
