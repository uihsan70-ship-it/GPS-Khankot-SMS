:root{

.masthead::after{content:"";position:absolute;inset:0;opacity:.10;background-image:radial-gradient(circle at 15% 20%, transparent 38%, rgba(255,255,255,.5) 38.5%, transparent 39%),radial-gradient(circle at 85% 70%, transparent 46%, rgba(255,255,255,.4) 46.5%, transparent 47%);pointer-events:none;}

.crest{flex:0 0 auto;}

.classbtns{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;}
.classbtn{flex:0 0 auto;padding:7px 13px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.classbtn.active{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-color:var(--navy);}
.chip-boy{display:inline-block;padding:4px 11px;border-radius:7px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2E6FE0,#5B9CFB);}

.dashgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.dashcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;}
.dashcard .big{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--crest);}
.dashcard .lbl{color:var(--sub);font-size:12px;margin-top:4px;}

.loginwrap{max-width:340px;margin:60px auto 0;padding:0 16px;}

select{background:var(--card);}

<script>
const firebaseConfig = {

const firestore = firebase.firestore();
const storage = firebase.storage();

const secondaryAuth = secondaryApp.auth();
firestore.enablePersistence({ synchronizeTabs: true }).catch(()=>{});

async function uploadStudentPhoto(studentId, file){
  const ext = (file.name.split(".").pop()||"jpg").toLowerCase();
  const ref = storage.ref(`student-photos/${studentId}_${Date.now()}.${ext}`);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await firestore.collection("students").doc(studentId).update({photoUrl: url});
  logActivity("update", "students/"+studentId, "photo uploaded");
  return url;
}

let CURRENT_UID=null, CURRENT_USER="Staff", CURRENT_ROLE="teacher";

async function logActivity(action, target, summary){
  try{
    await firestore.collection("activityLog").add({ user: CURRENT_USER, action, target, summary: (summary||"").toString().slice(0,140), at: Date.now() });
  }catch(e){}
}

const db = {
  collection(name){
    return {
      onSnapshot(cb){
        return firestore.collection(name).onSnapshot(snap=>{
          cb({ docs: snap.docs.map(d=>({ id:d.id, data:d.data() })) });
        });
      },
      async add(obj){
        const ref = await firestore.collection(name).add(obj);
        logActivity("add", name, obj && (obj.name||obj.title||obj.subject||""));
        return ref;
      }
    };
  },
  doc(path){
    const ref = firestore.doc(path);
    return {
      onSnapshot(cb){
        return ref.onSnapshot(snap=>{
          cb({ exists: snap.exists, data: snap.exists ? snap.data() : undefined, id: snap.id });
        });
      },
      async get(){ const s = await ref.get(); return { exists: s.exists, data: s.exists ? s.data() : undefined, id: s.id }; },
      async set(obj){ await ref.set(obj, {merge:false}); logActivity("set", path, ""); },
      async update(obj){ await ref.update(obj); logActivity("update", path, Object.keys(obj).join(",")); },
      async delete(){ await ref.delete(); logActivity("delete", path, ""); }
    };
  }
};

window.addEventListener('unhandledrejection', function(e){
  const reason = e && e.reason ? (e.reason.message || e.reason.code || JSON.stringify(e.reason)) : "unknown error";
  alert("Save failed: " + reason);
});
window.addEventListener("online", ()=>{ const b=document.getElementById("offlineBanner"); if(b) b.classList.remove("show"); });
window.addEventListener("offline", ()=>{ const b=document.getElementById("offlineBanner"); if(b) b.classList.add("show"); });
if("serviceWorker" in navigator){ window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{})); }

const CLASS_LIST = ["Nursery","LKG","UKG","Class 1","Class 2","Class 3","Class 4","Class 5"];
const EXAM_TERMS = ["Weekly Test","Mid-Term","Final Term"];
let selectedTerm = EXAM_TERMS[0];
let genderFilter = "";
function sortByRoll(list){
  return [...list].sort((a,b)=>{
    const ra = parseInt(a.rollNo,10), rb = parseInt(b.rollNo,10);
    const na = isNaN(ra), nb = isNaN(rb);
    if(na && nb) return (a.name||"").localeCompare(b.name||"");
    if(na) return 1;
    if(nb) return -1;
    return ra-rb;
  });
}

let LANG = localStorage.getItem("gps_lms_lang") || "en";
const TR = {
  "Dashboard":"ڈیش بورڈ","Classes":"جماعتیں","Students":"طلبہ","Attendance":"حاضری","Grades":"نتائج",
  "Fine":"جرمانہ","Homework":"ہوم ورک","Notices":"نوٹسز","Messages":"پیغامات","Timetable":"ٹائم ٹیبل",
  "Activity":"سرگرمی","Backup":"بیک اپ","Staff":"عملہ",
  "Staff sign-in":"عملے کے لیے سائن ان","Email":"ای میل","Password":"پاس ورڈ","Sign in":"سائن ان کریں",
  "Sign out":"سائن آؤٹ","Signed in as":"بطور سائن ان",
  "School Management System · Nursery to Class 5":"سکول مینجمنٹ سسٹم · نرسری تا پانچویں جماعت"
};
function t(s){ return LANG==="ur" ? (TR[s]||s) : s; }
function toggleLang(){ LANG = LANG==="en" ? "ur" : "en"; localStorage.setItem("gps_lms_lang", LANG); renderTabs(); renderMasthead(); }
function renderMasthead(){
  document.querySelector(".school-tag").textContent = t("School Management System · Nursery to Class 5");
  document.getElementById("langBtn").textContent = LANG==="en" ? "اردو" : "English";
  document.querySelector(".namebar span").innerHTML = t("Signed in as") + " <b id=\"userLabel\">" + esc(CURRENT_USER) + "</b><span class=\"role-badge\" id=\"roleBadge\">" + esc(CURRENT_ROLE) + "</span>";
}
let students=[], homework=[], notices=[], activityLog=[], staffList=[], tab="dashboard", selectedStudent=null, ttDoc={grid:{}}, attDate=todayStr(), classFilter="", listenersOn=false, staffSubTab="profile", staffAttDate=todayStr();

function todayStr(){ return new Date().toISOString().slice(0,10); }
function render(html){ document.getElementById("root").innerHTML = html; }
function esc(s){ return (s||"").toString().replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }
function classOptions(sel){ return CLASS_LIST.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join(""); }
function phoneDigits(s){ return (s||"").replace(/[^0-9]/g,""); }

// ---------------- LOGIN ----------------
function renderLogin(err){
  document.getElementById("namebar").style.display="none";
  render(`
    <div class="loginwrap">
      <div class="card">
        <h2>${t("Staff sign-in")}</h2>
        <p class="sub">Ask your admin to create your account first (Firebase Console → Authentication → Add user).</p>
        <label>${t("Email")}</label><input id="li_email" type="email">
        <label>${t("Password")}</label><input id="li_pass" type="password">
        <button class="btn-primary" id="loginBtn" style="width:100%;">${t("Sign in")}</button>
        ${err ? `<div class="error" style="margin-top:8px;">${esc(err)}</div>` : ""}
        <button class="btn-sm" id="langBtnLogin" style="width:100%;margin-top:8px;">${LANG==="en"?"اردو":"English"}</button>
      </div>
    </div>
  `);
  document.getElementById("langBtnLogin").onclick = ()=>{ toggleLang(); renderLogin(err); };
  document.getElementById("loginBtn").onclick = async ()=>{
    const email = document.getElementById("li_email").value.trim();
    const pass = document.getElementById("li_pass").value;
    if(!email||!pass) return;
    try{
      await firebase.auth().signInWithEmailAndPassword(email, pass);
    }catch(e){
      renderLogin(e.message || "Sign-in failed. Check your email and password.");
    }
  };
}

firebase.auth().onAuthStateChanged(async (user)=>{
  if(!user){ listenersOn=false; renderLogin(); return; }
  CURRENT_UID = user.uid;
  const staffRef = firestore.collection("staff").doc(user.uid);
  let staffSnap = await staffRef.get();
  if(!staffSnap.exists){
    const countSnap = await firestore.collection("staff").limit(1).get();
    const role = countSnap.empty ? "admin" : "teacher";
    const name = (user.email||"Staff").split("@")[0];
    await staffRef.set({ name, email:user.email||"", role, createdAt:Date.now() });
    staffSnap = await staffRef.get();
  }
  const sd = staffSnap.data();
  CURRENT_USER = sd.name || user.email || "Staff";
  CURRENT_ROLE = (sd.role || "teacher").trim().toLowerCase();
  document.getElementById("userLabel").textContent = CURRENT_USER;
  document.getElementById("roleBadge").textContent = CURRENT_ROLE;
  document.getElementById("namebar").style.display="flex";
  if(!navigator.onLine) document.getElementById("offlineBanner").classList.add("show");
  init();
});

document.getElementById("signOutBtn").onclick = ()=> firebase.auth().signOut();
document.getElementById("langBtn").onclick = toggleLang;

// ---------------- INIT / LISTENERS ----------------
function init(){
  render(`<div class="empty">Connecting…</div>`);
  if(listenersOn){ tab="dashboard"; renderTabs(); return; }
  listenersOn = true;
  db.collection("activityLog").onSnapshot(snap=>{
    activityLog=(snap.docs||[]).map(d=>({id:d.id, ...d.data})).sort((a,b)=>(b.at||0)-(a.at||0));
    if(tab==="activity") renderTabs();
  });
  db.collection("staff").onSnapshot(snap=>{
    staffList=(snap.docs||[]).map(d=>({id:d.id, ...d.data}));
    if(tab==="staff") renderTabs();
  });
  db.collection("students").onSnapshot(snap=>{
    students = (snap.docs||[]).map(d=>({id:d.id, ...d.data}));
    if(selectedStudent && !students.find(s=>s.id===selectedStudent)) selectedStudent=null;
    renderTabs();
  });
  db.collection("homework").onSnapshot(snap=>{
    homework=(snap.docs||[]).map(d=>({id:d.id, ...d.data})).sort((a,b)=>(b.postedAt||0)-(a.postedAt||0));
    if(tab==="homework"||tab==="dashboard") renderTabs();
  });
  db.collection("notices").onSnapshot(snap=>{
    notices=(snap.docs||[]).map(d=>({id:d.id, ...d.data})).sort((a,b)=>(b.postedAt||0)-(a.postedAt||0));
    if(tab==="notices"||tab==="dashboard") renderTabs();
  });
  db.doc("timetable/main").onSnapshot(snap=>{
    ttDoc = (snap && snap.exists) ? snap.data : {grid:{}};
    if(tab==="timetable" && !(document.activeElement && document.activeElement.classList.contains("tt-cell"))) renderTabs();
  });
  renderTabs();
}

function setTab(t){ tab=t; renderTabs(); }

function renderTabs(){
  let tabs=[["dashboard","🏠","Dashboard"],["classes","🏫","Classes"],["students","🎓","Students"],["attendance","📋","Attendance"],["grades","📘","Grades"],["fine","⚖","Fine"],["homework","✎","Homework"],["notices","📣","Notices"],["messages","✉","Messages"],["timetable","🗓","Timetable"],["activity","📖","Activity"],["backup","⛁","Backup"]];
  if(CURRENT_ROLE==="admin") tabs.push(["staff","🧑‍🏫","Staff"]);
  render(`
    <div class="tabs">${tabs.map(([k,icon,l])=>`<div class="tab ${tab===k?'active':''}" data-tab="${k}"><span>${icon}</span>${t(l)}</div>`).join("")}</div>
    <div id="panel"></div>
  `);
  renderMasthead();
  document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>setTab(el.dataset.tab));
  const panel = document.getElementById("panel");
  const views = {dashboard:viewDashboard, classes:viewClasses, students:viewStudents, attendance:viewAttendance, grades:viewGrades, fine:viewFine, homework:viewHomework, notices:viewNotices, messages:viewMessages, timetable:viewTimetable, activity:viewActivity, backup:viewBackup, staff:viewStaff};
  panel.innerHTML = views[tab] ? views[tab]() : "";
  wireTab();
}

function viewDashboard(){
  const active = students.filter(s=>!s.archived);
  const today = todayStr();
  const present = active.filter(s=>(s.attendance||{})[today]==="present").length;
  const pct = active.length ? Math.round((present/active.length)*100) : 0;
  const hwDue = homework.filter(h=>!h.archived && h.dueDate===today).length;

async function promoteAllStudents(){
  const typed = prompt("This moves EVERY active student up one class, and graduates (archives) Class 5 students. This affects the whole school and cannot be easily undone.\n\nType PROMOTE to confirm:");
  if(typed!=="PROMOTE") return;
  const active = students.filter(s=>!s.archived);
  for(const s of active){
    const idx = CLASS_LIST.indexOf(s.className);
    if(idx<0) continue;
    if(idx === CLASS_LIST.length-1){
      await firestore.collection("students").doc(s.id).update({archived:true, archivedAt:Date.now(), graduated:true});
    } else {
      await firestore.collection("students").doc(s.id).update({className: CLASS_LIST[idx+1]});
    }
  }
  logActivity("promote", "students", `Promoted ${active.length} students`);
  alert("Promotion complete.");
}

function monthlyAttendanceTable(list, monthKey){
  if(!list.length) return `<div class="empty">No students to summarize.</div>`;
  const rows = list.map(s=>{
    const att = s.attendance||{};
    let present=0, absent=0, leave=0, marked=0;
    Object.keys(att).forEach(d=>{
      if(!d.startsWith(monthKey)) return;
      marked++;
      if(att[d]==="present") present++;
      else if(att[d]==="absent") absent++;
      else if(att[d]==="leave") leave++;
    });
    const pct = marked ? Math.round((present/marked)*100) : 0;
    const flag = marked && pct<75 ? `<span class="chip-red">${pct}%</span>` : `<span class="chip-green">${pct}%</span>`;
    return `<tr><td>${esc(s.name)}</td><td>${esc(s.className||"-")}</td><td>${present}</td><td>${absent}</td><td>${leave}</td><td>${flag}</td></tr>`;
  }).join("");
  return `<div class="table-wrap"><table><tr><th>Name</th><th>Class</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance %</th></tr>${rows}</table></div><p class="sub">Below 75% is flagged red — days with no mark aren't counted.</p>`;
}

  let grandObtained=0, grandTotal=0;
  const sections = termsToShow.map(term=>{
    const subjMap = term==="Previous entries" ? g : (g[term]||{});
    const subjects = Object.keys(subjMap);
    if(!subjects.length) return "";
    let sumObtained=0, sumTotal=0;
    const rows = subjects.map(subj=>{
      const v=subjMap[subj]; const isObj = v && typeof v==="object";
      const obtained = isObj ? v.obtained : v; const total = isObj ? v.total : null;
      if(isObj && total){ sumObtained+=Number(obtained)||0; sumTotal+=Number(total)||0; grandObtained+=Number(obtained)||0; grandTotal+=Number(total)||0; }
      const pct = (isObj && total) ? ((obtained/total)*100).toFixed(1)+"%" : "-";
      return `<tr><td>${esc(subj)}</td><td>${esc(obtained)}</td><td>${esc(total!=null?total:"-")}</td><td>${pct}</td></tr>`;

function shareParentSummaryWhatsApp(stu){
  const today = todayStr();
  const monthKey = today.slice(0,7);
  const att = stu.attendance||{};
  let present=0, marked=0;
  Object.keys(att).forEach(d=>{ if(d.startsWith(monthKey)){ marked++; if(att[d]==="present") present++; } });
  const attPct = marked ? Math.round((present/marked)*100) : 0;
  const f = stu.fine||{amount:0,paid:true};
  const text = `GPS Khankot - Summary for ${stu.name} (${stu.className})\nAttendance this month: ${present}/${marked} (${attPct}%)\nFine: ${f.amount>0 ? (f.paid?"Cleared":"Outstanding Rs."+f.amount) : "None"}`;
  const digits = phoneDigits(stu.guardianContact);
  window.open(digits ? `https://wa.me/${digits}?text=${encodeURIComponent(text)}` : `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, "_blank");
}

function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lines.map(l=>l.split(",").map(c=>c.trim().replace(/^"|"$/g,"")));
}

async function readRowsFromFile(file){
  const ext = file.name.split(".").pop().toLowerCase();
  if(ext==="csv"){
    const text = await file.text();
    return parseCsv(text);
  }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
  return rows.filter(r=>r.length && r.some(c=>String(c).trim()!=="")).map(r=>r.map(c=>String(c).trim()));
}

async function importStudentsCsv(){
  const fileInput = document.getElementById("importFile");
  const status = document.getElementById("importStatus");
  const file = fileInput.files[0];
  if(!file){ status.textContent = "Choose a CSV or Excel file first."; return; }
  const rows = await readRowsFromFile(file);
  const header = rows[0].map(h=>h.toLowerCase());
  const idx = (name)=>header.indexOf(name.toLowerCase());
  const iName=idx("name"), iClass=idx("class"), iGuardian=idx("guardiancontact"), iRoll=idx("rollno"), iAdm=idx("admissionno"), iDob=idx("dob"), iBlood=idx("bloodgroup"), iEmerg=idx("emergencycontact"), iGender=idx("gender");
  if(iName<0 || iClass<0){ status.textContent = "CSV must have at least Name and Class columns."; return; }
  const existingByKey = new Map(students.filter(s=>!s.archived).map(s=>[dupeKey(s), s]));
  const normGender = (v)=>{ const t=(v||"").toString().trim().toLowerCase(); return t.startsWith("m")?"Male":t.startsWith("f")?"Female":""; };
  let count=0, skipped=0, duplicates=0, updated=0;
  status.textContent = "Importing…";
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    const name = r[iName]; const className = r[iClass];
    if(!name || !CLASS_LIST.includes(className)){ skipped++; continue; }
    const rollNo = iRoll>=0 ? (r[iRoll]||"") : "";
    const key = name.trim().toLowerCase()+"|"+className+"|"+rollNo.trim();
    const gender = iGender>=0 ? normGender(r[iGender]) : "";
    if(existingByKey.has(key)){
      const ex = existingByKey.get(key);
      if(ex.id && gender && ex.gender!==gender){ await db.doc("students/"+ex.id).update({gender}); ex.gender=gender; updated++; }
      else { duplicates++; }
      continue;
    }
    existingByKey.set(key, {id:null, gender});
    await db.collection("students").add({
      name, className,
      guardianContact: iGuardian>=0 ? (r[iGuardian]||"") : "",
      rollNo: iRoll>=0 ? (r[iRoll]||"") : "",
      admissionNo: iAdm>=0 ? (r[iAdm]||"") : "",
      dob: iDob>=0 ? (r[iDob]||"") : "",
      bloodGroup: iBlood>=0 ? (r[iBlood]||"") : "",
      emergencyContact: iEmerg>=0 ? (r[iEmerg]||"") : "",
      gender,
      fine:{amount:0,reason:"",paid:true}, grades:{}, attendance:{}, messages:[]
    });
    count++;
  }
  let msg = `Imported ${count} student(s)`;
  if(updated) msg += `, filled in gender for ${updated} existing student(s)`;
  if(duplicates) msg += `, skipped ${duplicates} already-existing duplicate(s)`;
  if(skipped) msg += `, skipped ${skipped} row(s) with missing name or an unrecognized class name`;
  status.textContent = msg + ".";
}

function dupeKey(s){
  return (s.name||"").trim().toLowerCase()+"|"+(s.className||"")+"|"+(s.rollNo||"").trim();
}

async function findAndRemoveDuplicates(){
  const status = document.getElementById("dedupeStatus");
  const groups = {};
  students.filter(s=>!s.archived).forEach(s=>{
    const k = dupeKey(s);
    (groups[k] = groups[k]||[]).push(s);
  });
  const dupeGroups = Object.values(groups).filter(g=>g.length>1);
  const toRemove = dupeGroups.flatMap(g=>g.slice(1));
  if(!toRemove.length){ status.textContent = "No duplicates found."; return; }
  if(!confirm(`Found ${toRemove.length} duplicate record(s) across ${dupeGroups.length} student(s). Remove the extra copies? This keeps one copy of each and permanently deletes the rest.`)) return;
  status.textContent = "Removing…";
  for(const s of toRemove){ await firestore.collection("students").doc(s.id).delete(); }
  logActivity("delete", "duplicates", `Removed ${toRemove.length} duplicate students`);
  status.textContent = `Removed ${toRemove.length} duplicate record(s).`;
}

async function downloadFullBackup(){
  const btn = document.getElementById("downloadBackupBtn");
  btn.textContent = "Preparing backup…";
  const hwSnap = await firestore.collection("homework").get();
  const ntSnap = await firestore.collection("notices").get();
  const logSnap = await firestore.collection("activityLog").get();
  const ttSnap = await firestore.doc("timetable/main").get();
  const backup = {
    exportedAt: new Date().toISOString(),
    students: students.map(({id, ...rest})=>({id, ...rest})),
    homework: hwSnap.docs.map(d=>({id:d.id, ...d.data()})),
    notices: ntSnap.docs.map(d=>({id:d.id, ...d.data()})),
    activityLog: logSnap.docs.map(d=>({id:d.id, ...d.data()})),
    timetable: ttSnap.exists ? ttSnap.data() : {}
  };
  downloadBlob(JSON.stringify(backup, null, 2), "application/json", "gps-khankot-backup-" + todayStr() + ".json");
  btn.textContent = "Download full backup (.json)";
}

function downloadRosterCsv(){
  const today = todayStr();
  const header = "Name,Class,Guardian Contact,Fine Amount,Fine Status,Today Attendance\n";
  const rows = students.filter(s=>!s.archived).map(s=>{
    const f = s.fine || {amount:0,paid:true};
    const att = (s.attendance||{})[today] || "unmarked";
    return [s.name, s.className, s.guardianContact||"", f.amount||0, f.paid?"Cleared":"Outstanding", att].map(v=>`"${(v+"").replace(/"/g,'""')}"`).join(",");
  }).join("\n");
  downloadBlob(header+rows, "text/csv", "gps-khankot-roster-" + today + ".csv");
}

function downloadBlob(content, type, filename){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function restoreFromBackup(){
  const fileInput = document.getElementById("restoreFile");
  const file = fileInput.files[0];
  if(!file) return alert("Choose a backup .json file first.");
  const btn = document.getElementById("restoreBtn");
  btn.textContent = "Restoring…";
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(data.students){
      for(const s of data.students){
        const {id, ...rest} = s;
        await firestore.collection("students").doc(id).set(rest);
      }
    }
    if(data.homework) for(const h of data.homework){ const {id, ...rest} = h; await firestore.collection("homework").add(rest); }
    if(data.notices) for(const n of data.notices){ const {id, ...rest} = n; await firestore.collection("notices").add(rest); }
    if(data.timetable) await firestore.doc("timetable/main").set(data.timetable);
    logActivity("restore", "backup", file.name);
    btn.textContent = "Restore complete!";
  }catch(e){
    alert("Restore failed: " + e.message);
    btn.textContent = "Restore from file";
  }
}
